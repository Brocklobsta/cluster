machine:
  kubelet:
    extraConfig:
      # ImageFS shares the node filesystem with non-image data. Keep the GC
      # target above its normal baseline, with headroom before 85% eviction.
      imageGCHighThresholdPercent: 75
      imageGCLowThresholdPercent: 65
      # Only collect images older than x minutes
      imageMinimumGCAge: "30m"
