---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: truenas-api-exporter
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/observability/truenas-api-exporter/app
  prune: true
  dependsOn:
    - name: truenas-exporter # Owns the shared truenas-exporter Namespace.
  sourceRef:
    kind: GitRepository
    name: cluster
