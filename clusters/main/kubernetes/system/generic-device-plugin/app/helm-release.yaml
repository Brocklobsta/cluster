apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: generic-device-plugin
    namespace: generic-device-plugin
spec:
    interval: 15m
    chart:
        spec:
            # renovate: registryUrl=https://charts.truechartsoci.org
            chart: generic-device-plugin
            version: 5.0.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 15m
    timeout: 30m
    install:
        timeout: 30m
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
        # Bridge common2026 independently of device-plugin binary/resource changes.
        image:
            tag: latest@sha256:ba6f0b4cf6c858d6ad29ba4d32e4da11638abbc7d96436bf04f582a97b2b8821
        resources:
            requests:
                cpu: 10m
                memory: 50Mi
            limits:
                cpu: 4000m
                memory: 8Gi
