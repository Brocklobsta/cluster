apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-helm-recovery
  namespace: flux-system
spec:
  dependsOn:
    - name: nginx-external
    - name: nginx-internal
  interval: 10m
  path: clusters/main/kubernetes/system/longhorn/recovery/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  timeout: 5m
  wait: true
