apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
    - name: snapshot-controller
  interval: 10m
  path: clusters/main/kubernetes/system/longhorn/config/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
