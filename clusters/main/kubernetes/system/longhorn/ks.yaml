apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
    - name: multus
    - name: nginx-external
    - name: nginx-internal
    - name: snapshot-controller
  interval: 10m
  path: clusters/main/kubernetes/system/longhorn/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  timeout: 35m
  wait: true

