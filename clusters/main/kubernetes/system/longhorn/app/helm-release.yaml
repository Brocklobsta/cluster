apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
  timeout: 30m
  install:
    timeout: 30m
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      storageNetwork: "longhorn-system/storage-network"
      # Increase to 3 for a multi-node cluster
      defaultReplicaCount: "2"
      # Overprovisioning might be needed when using volsync
      storageOverProvisioningPercentage: "100000"
      v2DataEngine: false
      # Permit maintenance when another healthy replica exists, but continue to
      # block draining a node that contains a volume's last healthy replica.
      nodeDrainPolicy: block-if-contains-last-replica
    persistence:
      # Set to false to pick another CSI as default
      defaultClass: true
      # Increase to 3 for a multi-node cluster
      defaultClassReplicaCount: 2
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
