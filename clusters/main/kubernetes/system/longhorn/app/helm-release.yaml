apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
  timeout: 30m
  install:
    timeout: 30m
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ingress:
      enabled: true
      ingressClassName: internal
      host: longhorn.${DOMAIN_0}
      path: /
      pathType: Prefix
      tls: true
      tlsSecret: longhorn-tls-0
      annotations:
        cert-manager.io/cluster-issuer: domain-0-le-prod
        cert-manager.io/private-key-rotation-policy: Always
        nginx.ingress.kubernetes.io/auth-method: GET
        nginx.ingress.kubernetes.io/auth-url: http://authentik-http.authentik.svc.cluster.local:10230/outpost.goauthentik.io/auth/nginx
        nginx.ingress.kubernetes.io/auth-signin: 'https://auth.${DOMAIN_0}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri'
        nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
        nginx.ingress.kubernetes.io/auth-snippet: proxy_set_header X-Forwarded-Host $http_host;
    defaultSettings:
      storageNetwork: "longhorn-system/storage-network"
      # Increase to 3 for a multi-node cluster
      defaultReplicaCount: "2"
      # Overprovisioning might be needed when using volsync
      storageOverProvisioningPercentage: "100000"
      v2DataEngine: false
      nodeDrainPolicy: allow-if-replica-is-stopped
    persistence:
      # Set to false to pick another CSI as default
      defaultClass: true
      # Increase to 3 for a multi-node cluster
      defaultClassReplicaCount: 2
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
