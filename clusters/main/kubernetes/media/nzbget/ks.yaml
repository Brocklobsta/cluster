apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nzbget
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/media/nzbget/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  dependsOn:
    - name: longhorn
    - name: volsync
    - name: nginx-internal
