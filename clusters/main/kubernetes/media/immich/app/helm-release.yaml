apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 15m
  chart:
    spec:
      chart: immich
      version: 36.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    timeout: 30m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Los_Angeles
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: immich
          postgresqlDatabase: immich
        operator:
          monitoring:
            enablePodMonitor: true
          backups:
            enabled: true
            credentials: b2
            scheduledBackups:
            - name: daily-backup
              schedule: 0 6 0 * * *
              backupOwnerReference: self
              immediate: true
              suspend: false
            destinationPath: s3://${S3_BUCKET}/immich/cnpg
            serverName: immich-cnpg-main-pg18
            revision: ''
            target: prefer-standby
          mode: recovery
          recovery:
            credentials: b2
            destinationPath: s3://${S3_BUCKET}/immich/cnpg
            serverName: immich-cnpg-main-pg18
            revision: ''
          pgVersion: 18
          cluster:
            imageName: git.brocklobsta.net/clawdaddy/immich-postgresql:18.7-1.1.1@sha256:5daa1616b1dcdd91054491fa2641c1ddc3293fe39e8d66c4be82f2821fd88135
          type: vectorchord
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        path: ""
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: pics.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          nginx:
            enabled: true
    workload:
      main:
        podSpec:
          initContainers:
            initialize-storage-markers:
              enabled: true
              type: init
              imageSelector: image
              securityContext:
                capabilities:
                  disableS6Caps: true
              command:
                - /bin/sh
                - -ec
                - |
                  for directory in \
                    /usr/src/app/upload/encoded-video \
                    /usr/src/app/upload/library \
                    /usr/src/app/upload/upload \
                    /usr/src/app/upload/profile \
                    /usr/src/app/upload/thumbs \
                    /usr/src/app/upload/backups; do
                    if [ ! -f "$${directory}/.immich" ]; then
                      echo "Creating Immich storage marker in $${directory}"
                      touch "$${directory}/.immich"
                    fi
                  done
    persistence:
      library:
        enabled: true
        path: ${IMMICH_LIBRARY_PATH}
        readOnly: false
        server: ${TRUENAS_IP}
        type: nfs
        targetSelector:
          main:
            initialize-storage-markers: {}
      uploads:
        targetSelector:
          main:
            initialize-storage-markers: {}
      backups:
        targetSelector:
          main:
            initialize-storage-markers: {}
      thumbs:
        targetSelector:
          main:
            initialize-storage-markers: {}
      profile:
        targetSelector:
          main:
            initialize-storage-markers: {}
      video:
        targetSelector:
          main:
            initialize-storage-markers: {}
    # Retain the old Redis PVC offline. Dump/restore into the new Valkey layout before cutover.
    extraTpl:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: immich-redis-data
        namespace: immich
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
