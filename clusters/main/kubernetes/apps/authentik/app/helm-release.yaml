apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  chart:
    spec:
      chart: authentik
      version: 43.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    timeout: 30m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Los_Angeles
    authentik:
      credentials:
        email: ${ADMIN_EMAIL}
        password: ${ADMIN_PASSWORD}
      email:
        from: ${ADMIN_EMAIL}
        host: protonmail-bridge.protonmail-bridge.svc.cluster.local
        password: ${PROTONMAIL_PASSWORD}
        port: 25
        timeout: 10
        useSSL: false
        useTLS: false
        username: ${PROTONMAIL_EMAIL}
      general:
        allowUserChangeEmail: true
        allowUserChangeName: true
        allowUserChangeUsername: false
      outposts:
        ldap:
          enabled: true
          token: ${AUTHENTIK_LDAP_TOKEN}
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: authentik
          postgresqlDatabase: authentik
          password: ${CNPG_PASSWORD}
        operator:
          monitoring:
            enablePodMonitor: true
          backups:
            credentials: b2
            enabled: true
            destinationPath: s3://${S3_BUCKET}/authentik/cnpg
            serverName: authentik-cnpg-main
            revision: ''
            target: prefer-standby
          mode: recovery
          # Migration bridge: retain PG15 AND its existing OS/image; do not upgrade majors here.
          pgVersion: 15
          cluster:
            imageName: ghcr.io/cloudnative-pg/postgresql:15.19@sha256:11274300143f02d369ea2ff6082b028b6b662915f06bf59f26b808b53823475a
          recovery:
            credentials: b2
            destinationPath: s3://${S3_BUCKET}/authentik/cnpg
            serverName: authentik-cnpg-main
            revision: ''
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        path: ""
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - host: auth.${DOMAIN_0}
          - host: "request.${DOMAIN_0}"
            paths:
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          nginx:
            enabled: true
    persistence:
      blueprints:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: blueprints
            src:
              enabled: true
              trigger:
                schedule: 0 8 * * *
            type: restic
      certs:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: certs
            src:
              enabled: true
              trigger:
                schedule: 5 8 * * *
            type: restic
      geoip:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: geo-ip
            src:
              enabled: true
              trigger:
                schedule: 10 8 * * *
            type: restic
      media:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: media
            src:
              enabled: true
              trigger:
                schedule: 15 8 * * *
            type: restic
      templates:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: templates
            src:
              enabled: true
              trigger:
                schedule: 3 8 * * *
            type: restic
