apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  dependsOn:
    - name: plugin-barman-cloud
  interval: 10m
  path: clusters/main/kubernetes/apps/authentik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
