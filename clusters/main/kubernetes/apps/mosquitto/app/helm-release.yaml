apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  interval: 15m
  chart:
    spec:
      chart: mosquitto
      version: 18.6.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    timeout: 30m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: volsync.backube
              version: v1alpha1
              kind: ReplicationDestination
            patch: |-
              - op: add
                path: /spec/restic/moverSecurityContext/runAsNonRoot
                value: true
              - op: add
                path: /spec/restic/moverSecurityContext/seccompProfile
                value:
                  type: RuntimeDefault
          - target:
              group: volsync.backube
              version: v1alpha1
              kind: ReplicationSource
            patch: |-
              - op: add
                path: /spec/restic/moverSecurityContext/runAsNonRoot
                value: true
              - op: add
                path: /spec/restic/moverSecurityContext/seccompProfile
                value:
                  type: RuntimeDefault
  values:
    TZ: America/Los_Angeles
    auth:
      enabled: true
    websockets:
      enabled: false
    service:
      websockets:
        enabled: false
    configmap:
      config:
        enabled: true
        data:
          mosquitto.conf: |
            listener 1883
            protocol mqtt
            allow_anonymous false
            password_file /mosquitto/secrets/password_file
            acl_file /mosquitto/secrets/acl_file
            persistence true
            persistence_location /mosquitto/data
            persistence_file mosquitto.db
            autosave_interval 1800
            log_dest stdout
            log_type error
            log_type warning
            log_type notice
            connection_messages true
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        name: b2
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    persistence:
      data:
        enabled: true
        mountPath: /mosquitto/data
        size: 1Gi
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: data
            src:
              enabled: true
              trigger:
                schedule: 35 1 * * *
            type: restic
      configinc:
        enabled: false
      broker-files:
        enabled: true
        type: secret
        objectName: mosquitto-broker-files
        expandObjectName: false
        mountPath: /mosquitto/secrets
        readOnly: true
        defaultMode: "0440"
        items:
          - key: password_file
            path: password_file
          - key: acl_file
            path: acl_file
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      container:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        privileged: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      pod:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
