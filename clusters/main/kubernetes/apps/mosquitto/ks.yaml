apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: smarthome-namespace
  path: clusters/main/kubernetes/apps/mosquitto/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
