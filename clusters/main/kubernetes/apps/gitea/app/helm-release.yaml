apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 15m
  chart:
    spec:
      chart: gitea
      version: 28.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    timeout: 30m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Los_Angeles
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      username: brock
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: gitea
          postgresqlDatabase: gitea
          password: ${CNPG_PASSWORD}
        operator:
          monitoring:
            enablePodMonitor: true
          backups:
            credentials: b2
            enabled: true
            destinationPath: s3://${S3_BUCKET}/gitea/cnpg
            serverName: gitea-cnpg-main
            revision: ''
            target: prefer-standby
          mode: recovery
          # Migration bridge: retain PG15 AND its existing OS/image; do not upgrade majors here.
          pgVersion: 15
          # Hibernated: Helm Ready does not establish that a new DB image has started.
          cluster:
            imageName: ghcr.io/cloudnative-pg/postgresql:15.19@sha256:11274300143f02d369ea2ff6082b028b6b662915f06bf59f26b808b53823475a
          recovery:
            credentials: b2
            destinationPath: s3://${S3_BUCKET}/gitea/cnpg
            serverName: gitea-cnpg-main
            revision: ''
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    customConfig:
      - name: mailer
        keys:
          - name: ENABLED
            value: "true"
          - name: FROM
            value: gitea@${DOMAIN_0}
          - name: PROTOCOL
            value: smtp+starttls
          - name: SMTP_ADDR
            value: protonmail-bridge.protonmail-bridge.svc.cluster.local
          - name: SMTP_PORT
            value: "25"
          - name: FORCE_TRUST_SERVER_CERT
            value: "true"
          - name: USER
            value: ${PROTONMAIL_EMAIL}
          - name: PASSWD
            value: ${PROTONMAIL_PASSWORD}
      - name: service
        keys:
          - name: DISABLE_REGISTRATION
            value: "true"
          - name: REGISTER_EMAIL_CONFIRM
            value: "true"
      - name: oauth2_client
        keys:
          - name: ENABLE_AUTO_REGISTRATION
            value: "true"
      - name: openid
        keys:
          - name: ENABLE_OPENID_SIGNUP
            value: "true"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: git.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          nginx:
            enabled: true
    persistence:
      data:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: data
            src:
              enabled: true
              trigger:
                schedule: 25 8 * * *
            type: restic
    service:
      ssh:
        enabled: true
        loadBalancerIP: ${GITEA_IP}
        ports:
          ssh:
            enabled: true
            port: 2222
            targetPort: 2222
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
