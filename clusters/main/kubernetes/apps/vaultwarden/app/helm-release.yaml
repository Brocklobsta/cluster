apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 15m
  chart:
    spec:
      chart: vaultwarden
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    timeout: 30m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: America/Los_Angeles
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: vaultwarden
          postgresqlDatabase: vaultwarden
          password: ${CNPG_PASSWORD}
        operator:
          monitoring:
            enablePodMonitor: true
          backups:
            credentials: b2
            enabled: true
            destinationPath: s3://${S3_BUCKET}/vaultwarden/cnpg
            serverName: vaultwarden-cnpg-main
            revision: ''
            target: prefer-standby
          mode: recovery
          # Migration bridge: retain PG15 AND its existing OS/image; do not upgrade majors here.
          pgVersion: 15
          # Hibernated: Helm Ready does not establish that a new DB image has started.
          cluster:
            imageName: ghcr.io/cloudnative-pg/postgresql:15.19@sha256:11274300143f02d369ea2ff6082b028b6b662915f06bf59f26b808b53823475a
          recovery:
            method: object_store
            credentials: b2
            destinationPath: s3://${S3_BUCKET}/vaultwarden/cnpg
            serverName: vaultwarden-cnpg-main
            revision: ''
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: vault.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          nginx:
            enabled: true
        required: true
    persistence:
      data:
        volsync:
          - credentials: b2
            dest:
              enabled: true
            name: config
            src:
              enabled: true
              trigger:
                schedule: 0 10 * * *
            type: restic
    vaultwarden:
      admin:
        disableAdminToken: false
        enabled: true
        token: ${ADMIN_PASSWORD}
      allowInvitation: true
      allowSignups: false
      showPasswordHint: true
      log:
        level: "info"
      smtp:
        authMechanism: Login
        enabled: true
        from: ${ADMIN_EMAIL}
        fromName: Vaultwarden
        heloName: ""
        host: protonmail-bridge-smtp.protonmail-bridge.svc.cluster.local
        invalidCertificate: true
        invalidHostname: false
        password: ${PROTONMAIL_PASSWORD}
        port: 25
        security: starttls
        timeout: 15
        user: ${PROTONMAIL_EMAIL}
      verifySignup: true
