apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: teslamate
spec:
  interval: 15m
  chart:
    spec:
      chart: teslamate
      version: 10.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system

  values:
    TZ: America/Los_Angeles
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: teslamate
          postgresqlDatabase: teslamate
        operator:
          monitoring:
            enablePodMonitor: true
          mode: recovery
          backups:
            enabled: true
            credentials: b2
            scheduledBackups:
            - name: daily-backup
              schedule: 30 5 0 * * *
              backupOwnerReference: self
              immediate: true
              suspend: false
            destinationPath: s3://${S3_BUCKET}/teslamate/cnpg
            serverName: teslamate-cnpg-main
            revision: ''
            target: prefer-standby
          recovery:
            method: object_store
            credentials: b2
            destinationPath: s3://${S3_BUCKET}/teslamate/cnpg
            serverName: teslamate-cnpg-main
            revision: ''
          # Keep the existing PG16 OS/image during the common/plugin migration.
          pgVersion: 16
          cluster:
            imageName: ghcr.io/cloudnative-pg/postgresql:16.15@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
    credentials:
      b2:
        accessKey: ${S3_KEY_ID}
        bucket: ${S3_BUCKET}
        encrKey: ${S3_PASSWORD}
        secretKey: ${S3_SECRET_KEY}
        type: s3
        url: ${S3_ENDPOINT}
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: tesla.${DOMAIN_0}
            paths:
            - path: /
              pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
          nginx:
            enabled: true
            auth:
              type: "authentik"
              internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              externalHost: "auth.${DOMAIN_0}"
              # Can be left default in most cases
              responseHeaders: []
